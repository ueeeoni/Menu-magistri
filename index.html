<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magistri - Braceria & Gastronomia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #121212;
            --bg-card: #1a1a1a;
            --border-color: #2a2a2a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #d32f2f; /* Rosso ripreso dal logo */
            --accent-glow: rgba(211, 47, 47, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(180deg, #181818 0%, var(--bg-deep) 100%);
            padding: 2.5rem 1rem 1.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--accent);
        }

        .logo-container {
            max-width: 220px;
            margin: 0 auto 1rem auto;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.5rem;
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 0.8rem;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Navigazione rapida a categorie */
        .category-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 1rem;
            background: var(--bg-deep);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-pill {
            background: var(--bg-card);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            text-decoration: none;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .nav-pill:hover, .nav-pill.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .menu-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .category-section {
            margin-bottom: 2.5rem;
            scroll-margin-top: 70px;
        }

        .category-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid var(--border-color);
        }

        .menu-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.1rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            transition: border-color 0.2s;
        }

        .menu-item:hover {
            border-color: rgba(211, 47, 47, 0.4);
        }

        .item-info {
            flex-grow: 1;
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 0.2rem 0;
            color: var(--text-main);
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .item-price {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
        }

        /* Admin Trigger & Panel */
        .admin-trigger {
            display: block;
            margin: 3rem auto 1rem auto;
            background: transparent;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .admin-trigger:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .admin-panel {
            max-width: 700px;
            margin: 0 auto 3rem auto;
            padding: 1.5rem;
            background: #181818;
            border: 1px solid var(--accent);
            border-radius: 12px;
            display: none;
        }

        .admin-panel h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .admin-panel textarea {
            width: 100%;
            height: 250px;
            background: #0f0f0f;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
            font-family: monospace;
            font-size: 0.8rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }

        .admin-buttons {
            display: flex;
            gap: 0.8rem;
        }

        .btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-save { background-color: #2e7d32; color: white; }
        .btn-reset { background-color: #c62828; color: white; }

        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background: #0d0d0d;
        }

        footer p {
            margin-bottom: 0.3rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Magistri Braceria Paninoteca Gastronomia" onerror="this.src='https://i.ibb.co/6y4G85V/logo-magistri.jpg'">
        </div>
        <p>Corso Giuseppe Garibaldi 158 • Coperto: € 2,00</p>
    </header>

    <!-- Barra di navigazione rapida tra le categorie -->
    <div class="category-nav" id="categoryNav"></div>

    <div class="menu-container" id="menu-container">
        <!-- Generato via JavaScript -->
    </div>

    <button class="admin-trigger" onclick="toggleAdmin()">⚙️ Modifica Menù dal Telefono</button>

    <div class="admin-panel" id="adminPanel">
        <h3>Pannello di Modifica Rapida</h3>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.8rem;">Modifica i testi o i prezzi in formato JSON e salva.</p>
        <textarea id="jsonInput"></textarea>
        <div class="admin-buttons">
            <button class="btn btn-save" onclick="saveMenu()">Salva Modifiche</button>
            <button class="btn btn-reset" onclick="resetMenu()">Ripristina</button>
        </div>
    </div>

    <footer>
        <p><strong>Macelleria Magistri</strong></p>
        <p>&copy; Tutti i diritti riservati</p>
    </footer>

                        { name: "Heineken 66cl", desc: "Bottiglia 66cl", price: "€ 5,00" },
                        { name: "Corona 33cl", desc: "Bottiglia 33cl", price: "€ 4,00" },
                        { name: "Messina ai sali 50cl", desc: "Birra speciale 50cl", price: "€ 6,00" }
                    ]
                }
            ]
        };

        function getMenuData() {
            const saved = localStorage.getItem('magistri_menu_v6');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { return defaultMenu; }
            }
            return defaultMenu;
        }

        function renderMenu() {
            const data = getMenuData();
            
            let navHtml = '';
            let html = '';

            data.categories.forEach(cat => {
                navHtml += `<a href="#${cat.id}" class="nav-pill">${cat.title}</a>`;

                html += `<div class="category-section" id="${cat.id}">`;
                html += `<div class="category-title">${cat.title}</div>`;
                cat.items.forEach(item => {
                    html += `
                        <div class="menu-item">
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                            </div>
                            <div class="item-price">${item.price}</div>
                        </div>
                    `;
                });
                html += `</div>`;
            });

            document.getElementById('categoryNav').innerHTML = navHtml;
            document.getElementById('menu-container').innerHTML = html;
            document.getElementById('jsonInput').value = JSON.stringify(data, null, 2);
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if(panel.style.display === 'block') {
                panel.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function saveMenu() {
            try {
                const newData = JSON.parse(document.getElementById('jsonInput').value);
                localStorage.setItem('magistri_menu_v6', JSON.stringify(newData));
                renderMenu();
                alert("Modifiche salvate con successo!");
                toggleAdmin();
            } catch (e) {
                alert("Errore nel formato del testo. Controlla di non aver cancellato virgolette o parentesi graffe.");
            }
        }

        function resetMenu() {
            if (confirm("Vuoi ripristinare il menù originale?")) {
                localStorage.removeItem('magistri_menu_v6');
                renderMenu();
                alert("Menù ripristinato.");
                toggleAdmin();
            }
        }

        renderMenu();
    </script>
</body>
</html>
