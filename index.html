<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macelleria Magistri - Braceria & Gastronomia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #e53935;
            --border-color: #2d2d2d;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
        }

        header p {
            margin: 0.5rem 0 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .menu-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .category-section {
            margin-bottom: 2.5rem;
        }

        .category-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-title::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .menu-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .item-info {
            flex-grow: 1;
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 0.3rem 0;
            color: var(--text-main);
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .item-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
        }

        .admin-trigger {
            display: block;
            margin: 3rem auto 1rem auto;
            background: transparent;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .admin-trigger:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .admin-panel {
            max-width: 650px;
            margin: 0 auto 3rem auto;
            padding: 1.5rem;
            background: #181818;
            border: 1px solid var(--accent);
            border-radius: 12px;
            display: none;
        }

        .admin-panel h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .admin-panel textarea {
            width: 100%;
            height: 220px;
            background: #0f0f0f;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
            font-family: monospace;
            font-size: 0.8rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }

        .admin-buttons {
            display: flex;
            gap: 0.8rem;
        }

        .btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-save { background-color: #2e7d32; color: white; }
        .btn-reset { background-color: #c62828; color: white; }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1 id="restaurant-name">Macelleria Magistri</h1>
        <p>Braceria & Gastronomia</p>
    </header>

    <div class="menu-container" id="menu-container">
        <!-- Generato automaticamente -->
    </div>

    <button class="admin-trigger" onclick="toggleAdmin()">⚙️ Modifica Menù dal Telefono</button>

    <div class="admin-panel" id="adminPanel">
        <h3>Pannello di Modifica Rapida</h3>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.8rem;">Modifica i piatti o i prezzi qui sotto e premi salva.</p>
        <textarea id="jsonInput"></textarea>
        <div class="admin-buttons">
            <button class="btn btn-save" onclick="saveMenu()">Salva Modifiche</button>
            <button class="btn btn-reset" onclick="resetMenu()">Ripristina</button>
        </div>
    </div>

    <footer>
        &copy; Macelleria Magistri - Corso Giuseppe Garibaldi 158, Napoli
    </footer>

    <script>
        const defaultMenu = {
            restaurant: "Macelleria Magistri",
            categories: [
                {
                    title: "Antipasti",
                    items: [
                        { name: "Tagliere della Braceria", desc: "Selezione di salumi artigianali e formaggi locali", price: "€ 12,00" },
                        { name: "Bruschetta del Contadino", desc: "Pomodorini freschi, aglio, olio extravergine e basilico", price: "€ 4,50" }
                    ]
                },
                {
                    title: "Carne",
                    items: [
                        { name: "Costata di Manzo", desc: "Selezionata e frollata (al etto)", price: "€ 4,00" },
                        { name: "Anchette di Pollo alla Brace", desc: "Marine alle spezie della casa", price: "€ 8,00" },
                        { name: "Salsiccia Artigianale", desc: "Produzione propria", price: "€ 6,50" }
                    ]
                },
                {
                    title: "Primi piatti",
                    items: [
                        { name: "Tonnarelli Cacio e Pepe", desc: "Pecorino Romano DOP e pepe nero", price: "€ 9,00" },
                        { name: "Rigatoni alla Gricia", desc: "Guanciale croccante e pecorino", price: "€ 9,50" }
                    ]
                },
                {
                    title: "Panini",
                    items: [
                        { name: "Panino con Salsiccia e Friarielli", desc: "Salsiccia artigianale e friarielli freschi saltati", price: "€ 7,50" },
                        { name: "Panino con Hamburger di Marchigiana", desc: "Hamburger di carne scelta, provola e insalata", price: "€ 8,50" }
                    ]
                },
                {
                    title: "Contorni",
                    items: [
                        { name: "Patate al Forno", desc: "Patate fresche aromatizzate al rosmarino", price: "€ 4,00" },
                        { name: "Verdure di Stagione", desc: "Preparate fresche tutti i giorni", price: "€ 4,00" }
                    ]
                },
                {
                    title: "Dolci",
                    items: [
                        { name: "Dolce della Casa", desc: "Chiedi al personale la proposta del giorno", price: "€ 4,50" }
                    ]
                },
                {
                    title: "Bibite",
                    items: [
                        { name: "Acqua Minerale 0.75l", desc: "Naturale o Frizzante", price: "€ 2,00" },
                        { name: "Vino della Casa (1/4)", desc: "Rosso o Bianco locale", price: "€ 3,50" },
                        { name: "Birra Artigianale 33cl", desc: "Selezione del birrificio", price: "€ 5,00" }
                    ]
                }
            ]
        };

        function getMenuData() {
            const saved = localStorage.getItem('magistri_menu_v3');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { return defaultMenu; }
            }
            return defaultMenu;
        }

        function renderMenu() {
            const data = getMenuData();
            document.getElementById('restaurant-name').innerText = data.restaurant;
            
            let html = '';
            data.categories.forEach(cat => {
                html += `<div class="category-section">`;
                html += `<div class="category-title">${cat.title}</div>`;
                cat.items.forEach(item => {
                    html += `
                        <div class="menu-item">
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                <div class="item-desc">${item.desc}</div>
                            </div>
                            <div class="item-price">${item.price}</div>
                        </div>
                    `;
                });
                html += `</div>`;
            });
            document.getElementById('menu-container').innerHTML = html;
            document.getElementById('jsonInput').value = JSON.stringify(data, null, 2);
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if(panel.style.display === 'block') {
                panel.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function saveMenu() {
            try {
                const newData = JSON.parse(document.getElementById('jsonInput').value);
                localStorage.setItem('magistri_menu_v3', JSON.stringify(newData));
                renderMenu();
                alert("Modifiche salvate con successo!");
                toggleAdmin();
            } catch (e) {
                alert("Errore nel formato del testo. Controlla di non aver cancellato virgolette o parentesi graffe.");
            }
        }

        function resetMenu() {
            if (confirm("Vuoi ripristinare il menù originale?")) {
                localStorage.removeItem('magistri_menu_v3');
                renderMenu();
                alert("Menù ripristinato.");
                toggleAdmin();
            }
        }

        renderMenu();
    </script>
</body>
</html>
