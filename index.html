<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macelleria Magistri - Braceria & Gastronomia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f1115;
            --bg-card: #181b22;
            --border-color: #262b36;
            --text-main: #f0f2f5;
            --text-muted: #94a3b8;
            --accent: #f97316;
            --accent-glow: rgba(249, 115, 22, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(180deg, #1a1f2c 0%, var(--bg-deep) 100%);
            padding: 3rem 1rem 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-badge {
            width: 70px;
            height: 70px;
            background: var(--accent);
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem auto;
            box-shadow: 0 0 25px var(--accent-glow);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .info-bar {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 0.8rem;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Navigazione rapida a categorie */
        .category-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 1rem;
            background: var(--bg-deep);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }

        .category-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-pill {
            background: var(--bg-card);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            text-decoration: none;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .nav-pill:hover, .nav-pill.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .menu-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        .category-section {
            margin-bottom: 2.5rem;
            scroll-margin-top: 70px;
        }

        .category-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid var(--border-color);
        }

        .menu-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.1rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            transition: border-color 0.2s;
        }

        .menu-item:hover {
            border-color: rgba(249, 115, 22, 0.4);
        }

        .item-info {
            flex-grow: 1;
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 0.2rem 0;
            color: var(--text-main);
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .item-price {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
        }

        /* Admin Trigger & Panel */
        .admin-trigger {
            display: block;
            margin: 3rem auto 1rem auto;
            background: transparent;
            border: 1px dashed var(--border-color);
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .admin-trigger:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        .admin-panel {
            max-width: 700px;
            margin: 0 auto 3rem auto;
            padding: 1.5rem;
            background: #14171f;
            border: 1px solid var(--accent);
            border-radius: 14px;
            display: none;
        }

        .admin-panel h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .admin-panel textarea {
            width: 100%;
            height: 250px;
            background: #0b0d12;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
            font-family: monospace;
            font-size: 0.8rem;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }

        .admin-buttons {
            display: flex;
            gap: 0.8rem;
        }

        .btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-save { background-color: #16a34a; color: white; }
        .btn-reset { background-color: #dc2626; color: white; }

        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background: #0b0d12;
        }

        footer p {
            margin-bottom: 0.3rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-badge">M</div>
        <h1 id="restaurant-name">Macelleria Magistri</h1>
        <p>Braceria & Gastronomia • Napoli</p>
    </header>

    <div class="info-bar">
        <span>📍 Corso Giuseppe Garibaldi 158</span>
        <span>🍽️ Coperto: € 2,00</span>
    </div>

    <!-- Barra di navigazione rapida tra le categorie -->
    <div class="category-nav" id="categoryNav"></div>

    <div class="menu-container" id="menu-container">
        <!-- Generato via JavaScript -->
    </div>

    <button class="admin-trigger" onclick="toggleAdmin()">⚙️ Modifica Menù dal Telefono</button>

    <div class="admin-panel" id="adminPanel">
        <h3>Pannello di Modifica Rapida</h3>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.8rem;">Modifica i testi o i prezzi in formato JSON e salva.</p>
        <textarea id="jsonInput"></textarea>
        <div class="admin-buttons">
            <button class="btn btn-save" onclick="saveMenu()">Salva Modifiche</button>
            <button class="btn btn-reset" onclick="resetMenu()">Ripristina</button>
        </div>
    </div>

    <footer>
        <p><strong>Macelleria Magistri</strong></p>
        <p>&copy; Tutti i diritti riservati</p>
    </footer>

                    ]
                }
            ]
        };

        function getMenuData() {
            const saved = localStorage.getItem('magistri_menu_v5');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { return defaultMenu; }
            }
            return defaultMenu;
        }

        function renderMenu() {
            const data = getMenuData();
            document.getElementById('restaurant-name').innerText = data.restaurant;
            
            let navHtml = '';
            let html = '';

            data.categories.forEach(cat => {
                // Genera i bottoni della barra in alto
                navHtml += `<a href="#${cat.id}" class="nav-pill">${cat.title}</a>`;

                // Genera le sezioni del menù
                html += `<div class="category-section" id="${cat.id}">`;
                html += `<div class="category-title">${cat.title}</div>`;
                cat.items.forEach(item => {
                    html += `
                        <div class="menu-item">
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                            </div>
                            <div class="item-price">${item.price}</div>
                        </div>
                    `;
                });
                html += `</div>`;
            });

            document.getElementById('categoryNav').innerHTML = navHtml;
            document.getElementById('menu-container').innerHTML = html;
            document.getElementById('jsonInput').value = JSON.stringify(data, null, 2);
        }

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            if(panel.style.display === 'block') {
                panel.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function saveMenu() {
            try {
                const newData = JSON.parse(document.getElementById('jsonInput').value);
                localStorage.setItem('magistri_menu_v5', JSON.stringify(newData));
                renderMenu();
                alert("Modifiche salvate con successo!");
                toggleAdmin();
            } catch (e) {
                alert("Errore nel formato del testo. Controlla di non aver cancellato virgolette o parentesi graffe.");
            }
        }

        function resetMenu() {
            if (confirm("Vuoi ripristinare il menù originale?")) {
                localStorage.removeItem('magistri_menu_v5');
                renderMenu();
                alert("Menù ripristinato.");
                toggleAdmin();
            }
        }

        renderMenu();
    </script>
</body>
</html>
